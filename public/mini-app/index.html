<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>SocialAnalyserBot Mini App</title>
    <link rel="stylesheet" href="/mini-app/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="/mini-app/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">SA</div>
        <div class="brand-copy">
          <strong id="brandName">SocialAnalyserBot</strong>
          <span id="connectionState">Mini App</span>
        </div>
        <button class="icon-button" type="button" data-action="refresh" aria-label="Refresh">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <nav class="tabs" aria-label="App sections">
        <button class="tab is-active" type="button" data-tab="analyze" data-action="tab">
          <span aria-hidden="true">⌕</span><span>Анализ</span>
        </button>
        <button class="tab" type="button" data-tab="reports" data-action="tab">
          <span aria-hidden="true">▤</span><span>Отчеты</span>
        </button>
        <button class="tab" type="button" data-tab="credits" data-action="tab">
          <span aria-hidden="true">◆</span><span>Кредиты</span>
        </button>
        <button class="tab" type="button" data-tab="settings" data-action="tab">
          <span aria-hidden="true">⚙</span><span>Профиль</span>
        </button>
      </nav>

      <main id="view" class="view" tabindex="-1">
        <section class="loading-state">
          <div class="loader" aria-hidden="true"></div>
          <p>Загружаем Mini App</p>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
