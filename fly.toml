# fly.toml app configuration file generated for ig-analyser-bot on 2026-06-04T13:56:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ig-analyser-bot'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'pnpm prisma:migrate'

[env]
  ANALYSIS_MAX_IMAGES_ANALYZED = '30'
  ANALYSIS_MAX_IMAGE_DOWNLOAD_MB = '8'
  ANALYSIS_POST_LIMIT = '30'
  APP_ENV = 'production'
  CHANNEL_URL = 'https://t.me/homie_tech'
  ECON_COST_BASIS = 'p75'
  ECON_PAYMENT_FEE_RESERVE = '0.20'
  ECON_STARS_PAYOUT_RESERVE = '0.20'
  ECON_STARS_USD_PER_STAR_PAYOUT_FLOOR = '0.01'
  ECON_TARGET_REVENUE_MULTIPLE = '3'
  ECON_USD_TO_RUB_BUFFER = '90'
  FACECHECK_TIMEOUT_SECONDS = '90'
  FEATURE_HR_MODE = 'false'
  FEATURE_INFLUENCER_MODE = 'true'
  FEATURE_OSINT_COMPLIANCE_MODE = 'false'
  FEATURE_PHOTO_SEARCH = 'false'
  FEATURE_TELEGRAM_STARS = 'true'
  FEATURE_YOOKASSA_PAYMENTS = 'true'
  LLM_CHAT_INPUT_TOKEN_BUDGET = '12000'
  LLM_CHAT_OUTPUT_TOKEN_BUDGET = '2048'
  LLM_FINAL_INPUT_TOKEN_BUDGET = '24000'
  LLM_FINAL_OUTPUT_TOKEN_BUDGET = '4096'
  PDF_RENDER_TIMEOUT_SECONDS = '60'
  PORT = '3000'
  PRIVACY_URL = 'https://telegram.org/privacy-tpa'
  REPORT_RETENTION_DAYS = '30'
  SUPPORT_URL = 'https://t.me/homie_tech'
  TELEGRAM_API_ROOT = 'https://api.telegram.org'
  TELEGRAM_STARS_DEFAULT_CURRENCY = 'XTR'
  TELEGRAM_USE_LONG_POLLING = 'false'
  TOS_URL = 'https://teletype.in/@homiebot/policy'
  VISION_BATCH_SIZE = '5'
  YOOKASSA_WEBHOOK_ALLOWED_IPS = '185.71.76.0/27,185.71.77.0/27,77.75.153.0/25,77.75.156.11,77.75.156.35,77.75.154.128/25,2a02:5180::/32'

[processes]
  web = 'node dist/src/server.js'
  worker = 'node dist/src/worker.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['web']

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['worker']
